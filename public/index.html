<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shkolla Ime</title>
<style>
:root{box-sizing:border-box;--bg:#f2f4fb;--card:#fff;--ink:#16203d;--mute:#6a7493;--pri:#3358ee;--pri2:#7a5cff;--acc:#ff9f43;--ok:#22b07d;--bad:#ef5b6b;--line:#e2e7f4;--sh:0 8px 24px #2a3a8a14;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1122;--card:#171e3a;--ink:#eef1fb;--mute:#98a2c6;--pri:#7391ff;--line:#262f56;--sh:0 8px 24px #0006;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1122;--card:#171e3a;--ink:#eef1fb;--mute:#98a2c6;--pri:#7391ff;--line:#262f56;--sh:0 8px 24px #0006;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:16px 18px 22px;border-radius:0 0 30px 30px;position:relative;overflow:hidden;flex:none}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:#ffffff18}
header:before{width:170px;height:170px;right:-50px;top:-70px}header:after{width:100px;height:100px;left:-30px;bottom:-50px}
.top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:50px;height:50px;background:#ffffff2b;border-radius:15px;padding:8px;flex:none;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.top h1{font-size:23px;line-height:1.1}.top p{font-size:12px;opacity:.85}
.top .sp{flex:1}
.ib{background:#ffffff2b;border:0;color:#fff;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
.greet{margin-top:14px;position:relative;z-index:1;font-size:14px;opacity:.95}
.greet b{font-size:19px;display:block}
main{flex:1;overflow-y:auto;padding:16px 16px 20px;scroll-behavior:smooth}
.pg{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.hero{background:linear-gradient(135deg,#ff9f43,#ff6b6b);color:#fff;border:0}
.hero small{opacity:.9;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.hero h3{font-size:22px;margin:4px 0}.hero .cd{font-size:30px;font-weight:800}
.bar{height:6px;border-radius:6px;background:#ffffff44;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.st b{font-size:21px;display:block}.st span{font-size:11px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.btn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:9px;font:700 15px inherit;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.btn:active{transform:scale(.95)}
.ic{width:48px;height:48px;border-radius:15px;color:#fff;display:grid;place-items:center}
svg.i{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c1{background:linear-gradient(135deg,#3358ee,#6f8cff)}.c2{background:linear-gradient(135deg,#22b07d,#6ee7b7)}.c3{background:linear-gradient(135deg,#ff9f43,#ff6b6b)}.c4{background:linear-gradient(135deg,#7a5cff,#c084fc)}
.dot{position:absolute;top:10px;right:12px;background:var(--bad);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;font-weight:700}
h2{font-size:20px;margin:2px 0 12px}h4{font-size:15px;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .g{flex:1}.row small{color:var(--mute);display:block;font-size:12px}
.tm{font-weight:700;color:var(--pri);width:46px;font-size:13px}
.now{background:color-mix(in srgb,var(--pri) 12%,transparent);border-radius:12px;padding-left:8px;margin:0 -8px}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:none;color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok)}.done{text-decoration:line-through;opacity:.55}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pill{border-radius:10px;padding:4px 11px;font-weight:800;color:#fff;font-size:15px}
.sub{cursor:pointer}.sub .det{display:none;padding:10px 0 4px}.sub.open .det{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips span{background:var(--bg);border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;border-radius:8px}
.ntf{display:flex;gap:12px;cursor:pointer}
.ntf .ic{width:42px;height:42px;border-radius:13px;flex:none}
.ntf p{font-size:13px;color:var(--mute);margin-top:6px;display:none;line-height:1.5}.ntf.open p{display:block}
.unr:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:8px;display:inline-block}
.av{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;margin:0 auto 10px;box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 25%,transparent)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{left:23px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));position:relative;flex:none}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 0;position:relative;z-index:1;transition:.2s}
nav button.on{color:var(--pri)}nav button.on svg{transform:translateY(-2px) scale(1.12)}
nav svg{transition:.2s;width:24px;height:24px}
#ind{position:absolute;top:4px;left:0;height:calc(100% - 8px);width:20%;padding:0 5px;transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
#ind i{display:block;height:100%;border-radius:14px;background:color-mix(in srgb,var(--pri) 14%,transparent)}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:absolute;inset:0;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;z-index:20;color:#fff;text-align:center;transition:opacity .5s .9s,visibility 0s 1.4s}
#splash.out{opacity:0;visibility:hidden}#splash svg{width:90px;height:90px;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}#splash h1{margin-top:10px;font-size:32px}
#auth{position:absolute;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column;overflow-y:auto}
.ah{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;text-align:center;padding:34px 20px 56px;border-radius:0 0 30px 30px;flex:none}
.ah svg{width:68px;height:68px;background:#ffffff2b;border-radius:20px;padding:11px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}.ah h1{font-size:28px;margin-top:8px}.ah p{opacity:.9;font-size:14px}
.af{margin:-34px 16px 20px;flex:none}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}.in:focus{outline:0;border-color:var(--pri)}
.pw{position:relative}.eye{position:absolute;right:8px;top:6px;background:none;border:0;font-size:18px;cursor:pointer;padding:6px}
.pb{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer;margin-top:4px}.pb:active{transform:scale(.98)}
.lk{display:block;width:100%;background:none;border:0;color:var(--pri);font:600 14px inherit;font-family:inherit;padding:12px;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}.rm{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px}.demo{text-align:center;font-size:12px;color:var(--mute);margin-top:4px}
img.logo{padding:0;background:none;border-radius:0;object-fit:contain}
#splash img{width:120px;height:120px;background:#fff;border-radius:30px;padding:14px;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
.ah img{width:88px;height:88px;background:#fff;border-radius:26px;padding:10px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.btn .ic{width:70px;height:70px;border-radius:22px;background:color-mix(in srgb,var(--pri) 10%,transparent)}.bi{width:52px;height:52px;object-fit:contain}
.hero{position:relative;overflow:hidden}.hd{position:absolute;right:-6px;bottom:-10px;width:92px;opacity:.3;transform:rotate(-10deg);pointer-events:none}
img.av{padding:10px;object-fit:contain}
.hav{width:40px;height:40px;border-radius:50%;background:#fff;padding:3px;cursor:pointer;object-fit:contain;position:relative;z-index:1}
.avp{display:flex;gap:14px;justify-content:center;margin-bottom:12px}.ap{width:78px;height:78px;border-radius:50%;border:3px solid var(--line);background:var(--bg);cursor:pointer;padding:6px}.ap.on{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 22%,transparent)}.ap img{width:100%;height:100%;object-fit:contain}
.tm{width:50px}.tm small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.cb{width:6px;height:40px;border-radius:4px;flex:none}.past{opacity:.5}
.brk{font-size:12px;color:var(--mute);padding:6px 0 6px 62px}.brk.now{color:var(--acc);font-weight:700}
.wk{display:grid;grid-template-columns:42px repeat(5,1fr);gap:5px;padding:12px}.wh{font-size:11px;font-weight:700;color:var(--mute);text-align:center}.wt{font-size:10px;color:var(--mute);display:grid;place-items:center}
.wc{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border-radius:9px;padding:10px 0;text-align:center;font-size:11px;font-weight:800}.wc.tdy{outline:2px solid var(--pri)}.wh.tdy{color:var(--pri)}
</style>
</head>
<body>
<div class="app">
  <div id="splash"><div><img id="sl" alt=""><h1>Shkolla Ime</h1></div></div>
  <header>
    <div class="top">
      <img class="logo" id="hl" alt="Ikona e shkollës">
      <div><h1>Shkolla Ime</h1><p>Aplikacioni i nxënësit</p></div><div class="sp"></div><img id="ha" class="hav" alt="Profili" onclick="go('profili')" style="display:none">
      <button class="ib" onclick="toggleTheme()" aria-label="Ndrysho temën"><svg class="i" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    </div>
    <div class="greet" id="greet"></div>
  </header>
  <main id="view"></main>
  <nav id="nav"><div id="ind"><i></i></div></nav>
  <div id="auth"></div><div id="toast"></div>
</div>

const fmt=m=>m>=60?`${Math.floor(m/60)}h ${m%60}min`:`${m} min`;

function st(){if(!wk())return{k:'we'};const di=new Date().getDay()-1,t=tl(di),m=nm();if(m<mins(t[0].s))return{k:'pre',left:mins(t[0].s)-m,next:t[0]};for(let j=0;j<t.length;j++){const x=t[j],a=mins(x.s),b=mins(x.e);if(m>=a&&m<b)return{k:x.b?'br':'ls',cur:x,next:t.slice(j+1).find(y=>!y.b),left:b-m,pct:(m-a)/(b-a)*100}}return{k:'post'}}
function hero(s){const nx=x=>x?`Pastaj: <b>${x.sub}</b> në ${x.s} · ${SB[x.sub][1]}`:'Kjo është ora e fundit 🎉';
if(s.k==='ls'){const b=SB[s.cur.sub];return `<small>Tani · Ora ${s.cur.i+1} nga 6</small><h3>${s.cur.sub}</h3><div>${b[0]} · ${b[1]}</div><div class="cd">${s.left} min mbeten</div><div class="bar"><i style="width:${s.pct}%"></i></div><div style="margin-top:8px;font-size:13px">${nx(s.next)}</div>`}
if(s.k==='br')return `<small>${s.cur.big?'Pushimi i madh':'Pushim'} ☕</small><h3>Mësimi vazhdon pas ${s.left} min</h3><div>${nx(s.next)}</div><div class="bar"><i style="width:${s.pct}%"></i></div>`;
if(s.k==='pre')return `<small>Shkolla fillon pas</small><div class="cd">${fmt(s.left)}</div><h3>Ora e parë: ${s.next.sub}</h3><div>${SB[s.next.sub][0]} · ${SB[s.next.sub][1]}</div>`;
const d=new Date().getDay(),nd=d>=1&&d<=4?d:0,lb=d>=1&&d<=4?'Nesër':'E hënë',f=SCH[nd][0];
return `<small>${s.k==='post'?'Dita shkollore mbaroi ✓':'Fundjavë 🎉'}</small><h3>${lb}: ${f}</h3><div>Fillon në ${BELL[0][0]} · ${SB[f][1]}</div>`}
function lrow(x,di,full){const td=wk()&&di===new Date().getDay()-1,m=nm(),past=td&&m>=mins(x.e),cur=td&&m>=mins(x.s)&&m<mins(x.e);
if(x.b)return `<div class="brk ${cur?'now':''} ${past?'past':''}">☕ ${x.big?'Pushimi i madh':'Pushim'} · ${x.s}–${x.e} (${mins(x.e)-mins(x.s)} min)</div>`;
const b=SB[x.sub];return `<div class="row ${cur?'now':''} ${past?'past':''}"><span class="tm">${x.s}<small>${x.e}</small></span><i class="cb" style="background:${b[2]}"></i><span class="g"><b>${x.sub}</b><small>${b[0]} · ${b[1]}</small>${cur&&full?`<div class="meter"><i style="width:${(m-mins(x.s))/45*100}%;background:${b[2]}"></i></div>`:''}</span>${cur?'<span class="pill" style="background:var(--ok);font-size:11px">TANI</span>':past?'<span style="color:var(--ok);font-weight:800">✓</span>':''}</div>`}
function home(){const s=st(),m=avg(SUBJ.map(x=>avg(x[1]))).toFixed(2),un=NT.filter(n=>!rd.includes(n.id)).length,di=wk()?new Date().getDay()-1:0;
return `<div class="card hero"><img class="hd" src="${IM.education}" alt="">${hero(s)}</div>
<div class="stats"><div class="st"><b style="color:var(--pri)">${m}</b><span>Mesatarja</span></div><div class="st"><b style="color:var(--ok)">96%</b><span>Prania</span></div><div class="st"><b style="color:var(--acc)">${HW.filter(h=>!h.on).length}</b><span>Detyra</span></div></div>
<div class="grid">${['notat','orari','njoftimet','profili'].map(k=>`<button class="btn" onclick="go('${k}')"><span class="ic ${CL[k]}"><img class="bi" src="${IM[BI(k)]}" alt=""></span>${L[k]}${k==='njoftimet'&&un?`<span class="dot">${un}</span>`:''}</button>`).join('')}</div>
<div class="card"><h4>Detyrat e shtëpisë</h4>${HW.map((h,i)=>`<div class="row"><button class="chk ${h.on?'on':''}" onclick="hw(${i})">${h.on?svg('ok'):''}</button><span class="g ${h.on?'done':''}">${esc(h.t)}</span><button class="lk" style="width:auto;padding:4px 8px;color:var(--mute)" onclick="delHw(${i})" aria-label="Fshi">✕</button></div>`).join('')}<div style="display:flex;gap:8px;margin-top:10px"><input class="in" id="nh" placeholder="Shto detyrë të re…" style="margin:0" onkeydown="if(event.key==='Enter')addHw()"><button class="pb" style="width:50px;margin:0;padding:0" onclick="addHw()" aria-label="Shto">+</button></div></div>
<div class="card"><h4>${wk()?'Sot':'Dita tjetër'} · ${DAYS[di]}</h4>${tl(di).filter(x=>!x.b).map(x=>lrow(x,di)).join('')}</div>`}
async function addHw(){const i=document.getElementById('nh'),t=i.value.trim();if(!t)return;const r=await api('/homework','POST',{title:t});if(!r.ok)return toast(r.error||'Gabim');HW.push({id:r.id,t,on:false});render();toast('Detyra u shtua ✓')}
function delHw(i){const h=HW.splice(i,1)[0];render();api('/homework/'+h.id,'DELETE')}
function hw(i){const h=HW[i];h.on=!h.on;if(h.on)toast('Bravo! Detyra u krye 🎉');render();api('/homework/'+h.id,'PATCH',{done:h.on})}
function notat(){const all=SUBJ.map(s=>avg(s[1]));
 return `<h2>Notat</h2><div class="card" style="text-align:center"><img src="${IM.hat}" alt="" style="width:54px;height:54px"><br><small style="color:var(--mute)">Mesatarja e përgjithshme</small><div style="font-size:44px;font-weight:800;color:${gc(avg(all))}">${avg(all).toFixed(2)}</div></div>`+
 SUBJ.map((s,i)=>{const a=avg(s[1]),pts=s[1].map((v,j)=>`${j*(200/(s[1].length-1||1))},${50-(v-5)*9}`).join(' ');
 return `<div class="card sub" id="s${i}" onclick="this.classList.toggle('open')"><div class="row" style="border:0;padding:0"><span class="ic" style="width:10px;height:36px;border-radius:5px;background:${s[2]}"></span><span class="g"><b>${s[0]}</b><small>${s[1].length} nota</small></span><span class="pill" style="background:${gc(a)}">${a.toFixed(1)}</span></div><div class="meter"><i style="width:${a*10}%;background:${s[2]}"></i></div>
 <div class="det"><div class="chips">${s[1].map(v=>`<span style="color:${gc(v)}">${v}</span>`).join('')}</div><svg viewBox="0 0 200 60" width="100%" height="60"><polyline points="${pts}" fill="none" stroke="${s[2]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><small style="color:var(--mute)">Ecuria e notave gjatë tremujorit</small></div></div>`}).join('')}
let ov='sot',dI=0;
function week(){const td=wk()?new Date().getDay()-1:-1;return `<div class="card wk"><div></div>${DAYS.map((d,i)=>`<div class="wh ${i===td?'tdy':''}">${d.slice(2,5)}</div>`).join('')}${BELL.map((b,p)=>`<div class="wt">${b[0]}</div>`+SCH.map((r,i)=>`<div class="wc ${i===td?'tdy':''}" style="--c:${SB[r[p]][2]}">${SB[r[p]][3]}</div>`).join('')).join('')}</div><p class="demo">Dita e sotme është e shënuar me kornizë.</p>`}
function zilet(){return `<div class="card"><h4>Zilet</h4>${BELL.map((b,i)=>`<div class="row"><span class="tm">${b[0]}</span><span class="g"><b>Ora ${i+1}</b><small>${b[0]} – ${b[1]} · 45 min</small></span></div>${i<5?`<div class="brk">☕ ${i===2?'Pushimi i madh':'Pushim'} · ${b[1]}–${BELL[i+1][0]}</div>`:''}`).join('')}</div><div class="card"><h4>Lëndët dhe mësuesit</h4>${Object.entries(SB).map(([n,b])=>`<div class="row"><i class="cb" style="background:${b[2]}"></i><span class="g"><b>${n}</b><small>${b[0]} · ${b[1]}</small></span></div>`).join('')}</div>`}
function orari(){if(!dI){day=wk()?new Date().getDay()-1:0;dI=1}
let h=`<h2>Orari</h2><div class="tabs">${[['sot','Dita'],['java','Java'],['zilet','Zilet & lëndët']].map(o=>`<button class="${ov===o[0]?'on':''}" onclick="ov='${o[0]}';render()">${o[1]}</button>`).join('')}</div>`;
if(ov==='sot'){const tdI=wk()?new Date().getDay()-1:-1,pc=Math.max(0,Math.min(100,(nm()-mins(BELL[0][0]))/(mins(BELL[5][1])-mins(BELL[0][0]))*100));
h+=`<div class="tabs">${DAYS.map((d,i)=>`<button class="${i===day?'on':''}" onclick="day=${i};render()">${d}${i===tdI?' •':''}</button>`).join('')}</div>`;
if(day===tdI)h+=`<div class="card"><b>Dita shkollore</b><span style="float:right;color:var(--mute)">${Math.round(pc)}%</span><div class="meter"><i style="width:${pc}%;background:var(--pri)"></i></div><small style="color:var(--mute)">${BELL[0][0]} – ${BELL[5][1]} · 6 orë mësimi</small></div>`;
h+=`<div class="card">${tl(day).map(x=>lrow(x,day,1)).join('')}</div>`}
else h+=ov==='java'?week():zilet();
return h}
function njoftimet(){const cats=['Të gjitha','Event','Provim','Admin'],list=NT.filter(n=>filt==='Të gjitha'||n.c===filt);
 return `<h2>Njoftimet</h2><div class="tabs">${cats.map(c=>`<button class="${c===filt?'on':''}" onclick="filt='${c}';render()">${c}</button>`).join('')}<button onclick="rd=NT.map(n=>n.id);api('/notices/read','POST',{ids:rd});toast('Të gjitha u shënuan si të lexuara');render()">✓ Lexo të gjitha</button></div>`+
 list.map(n=>`<div class="card ntf" onclick="this.classList.toggle('open');if(!rd.includes(${n.id})){rd.push(${n.id});api('/notices/read','POST',{ids:[${n.id}]});this.querySelector('b').classList.remove('unr')}"><span class="ic ${CAT[n.c]}">${svg('njoftimet')}</span><div><b class="${rd.includes(n.id)?'':'unr'}">${n.t}</b><small style="display:block;color:var(--mute)">${n.c} · ${n.d}</small><p>${n.x}</p></div></div>`).join('')}
function profili(){if(editing)return editForm();const dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 return `<div class="card" style="text-align:center"><img class="av" src="${IM[avk()]}" alt=""><h2 style="margin:0">${esc(U.name)}</h2><small style="color:var(--mute)">Klasa ${esc(U.cls)}</small></div>
 <div class="stats"><div class="st"><b>9.4</b><span>Mesatarja</span></div><div class="st"><b>96%</b><span>Prania</span></div><div class="st"><b>#3</b><span>Në klasë</span></div></div>
 <div class="card"><h4>Informacion</h4><div class="row"><span class="g">Mësuesi kujdestar<small>Znj. Mësuesja</small></span></div><div class="row"><span class="g">Viti shkollor<small>2026/2027</small></span></div><div class="row"><span class="g">Shkolla<small>Shkolla Ime</small></span></div><div class="row"><span class="g">Email<small>${esc(U.email)}</small></span></div><div class="row"><span class="g">Adresa<small>${esc(U.addr||'Nuk është shtuar')}</small></span></div><button class="lk" onclick="editing=true;render()">✎ Ndrysho profilin</button></div>
 <div class="card"><h4>Cilësimet</h4><div class="row"><span class="g">Tema e errët</span><button class="sw ${dk?'on':''}" onclick="toggleTheme()" aria-label="Tema e errët"></button></div><div class="row"><span class="g">Njoftime push</span><button class="sw on" onclick="this.classList.toggle('on')" aria-label="Njoftime"></button></div></div><button class="pb" style="background:var(--bad)" onclick="logout()">Dil nga llogaria</button>`}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ini=()=>U.name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('shkolla:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
const users=()=>ls.g('users',{});
function loadUser(){rd=ls.g('rd',[]);HW=ls.g('hw',[{t:'Ushtrimet 12–18, Matematikë',on:false},{t:'Ese: "Shkolla ime", Gjuhë shqipe',on:false},{t:'Projekt Fizikë: lëvizja',on:false}])}
function showAuth(){const a=document.getElementById('auth');a.style.display='flex';renderAuth()}
function setMode(m){mode=m;renderAuth()}
function eye(){const p=document.getElementById('fp');p.type=p.type==='password'?'text':'password'}
function renderAuth(){const r=mode==='up',f=mode==='rs';
document.getElementById('auth').innerHTML=`<div class="ah"><img src="${IM.education}" alt=""><h1>Shkolla Ime</h1><p>${f?'Rivendos fjalëkalimin':r?'Krijo llogarinë tënde':'Hyr në llogarinë tënde'}</p></div><div class="card af">
${f?'':`<div class="tabs"><button class="${r?'':'on'}" onclick="setMode('in')">Hyr</button><button class="${r?'on':''}" onclick="setMode('up')">Regjistrohu</button></div>`}
${r?`<p class="demo" style="margin:0 0 6px">Zgjidh gjininë tënde:</p>${avPicker(avSel)}<p class="demo" style="margin:-4px 0 10px">Avatari caktohet sipas gjinisë dhe nuk ndryshohet më vonë.</p><input class="in" id="fn" placeholder="Emri i plotë" autocomplete="name"><input class="in" id="fc" placeholder="Klasa (p.sh. 9-B)"><input class="in" id="fa" placeholder="Adresa e shtëpisë (opsionale)" autocomplete="street-address">`:''}
<input class="in" id="fe" type="email" placeholder="Adresa e emailit" autocomplete="email" inputmode="email">
<div class="pw"><input class="in" id="fp" type="password" placeholder="${f?'Fjalëkalimi i ri':'Fjalëkalimi'}" autocomplete="${r||f?'new-password':'current-password'}"><button type="button" class="eye" onclick="eye()" aria-label="Shfaq fjalëkalimin">👁</button></div>
${r?`<input class="in" id="fq" type="password" placeholder="Përsërit fjalëkalimin">`:''}
${r||f?'':`<label class="rm"><input type="checkbox" id="fr" checked> Më mbaj mend</label>`}
<div class="err" id="aerr"></div>
<button class="pb" onclick="submitAuth()">${f?'Ruaj fjalëkalimin':r?'Krijo llogarinë':'Hyr'}</button>
${r?'':f?`<button class="lk" onclick="setMode('in')">← Kthehu te hyrja</button>`:`<p class="demo">Harrove fjalëkalimin? Kontakto administratorin e shkollës.</p>`}</div>`}
async function api(path,method='GET',body){try{const r=await fetch('/api'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));return{...j,ok:r.ok}}catch(e){return{ok:false,error:'Nuk lidhet me serverin. Provo përsëri.'}}}
async function submitAuth(){const g=i=>(document.getElementById(i)||{}).value||'',e=g('fe').trim().toLowerCase(),p=g('fp'),er=m=>{document.getElementById('aerr').textContent=m};
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))return er('Shkruaj një adresë emaili të vlefshme.');
if(p.length<8)return er('Fjalëkalimi duhet të ketë të paktën 8 karaktere.');
let body={email:e,password:p,remember:!!(document.getElementById('fr')||{}).checked},path='/login';
if(mode==='up'){const n=g('fn').trim();if(n.length<2)return er('Shkruaj emrin e plotë.');if(p!==g('fq'))return er('Fjalëkalimet nuk përputhen.');body={...body,name:n,cls:g('fc').trim(),addr:g('fa').trim(),gender:avSel};path='/register'}
const btn=document.querySelector('#auth .pb');btn.disabled=true;er('');const r=await api(path,'POST',body);btn.disabled=false;
if(!r.ok)return er(r.error||'Diçka shkoi keq.');await finish(r.user)}
async function finish(u,quiet){U=u;const d=await api('/data');HW=d.ok?d.homework:[];rd=d.ok?d.reads:[];page='home';editing=false;document.getElementById('auth').style.display='none';render();if(!quiet)toast('Mirë se erdhe, '+u.name.split(' ')[0]+'! 👋')}
async function logout(){await api('/logout','POST');U=null;HW=[];rd=[];mode='in';showAuth();toast('U çkyçe me sukses')}
function editForm(){return `<h2>Ndrysho profilin</h2><div class="card"><input class="in" id="en" value="${esc(U.name)}" placeholder="Emri i plotë"><input class="in" id="ec" value="${esc(U.cls)}" placeholder="Klasa"><input class="in" id="ea" value="${esc(U.addr)}" placeholder="Adresa e shtëpisë"><button class="pb" onclick="saveProfile()">Ruaj</button><button class="lk" onclick="editing=false;render()">Anulo</button></div>`}
async function saveProfile(){const v=i=>document.getElementById(i).value.trim();if(v('en').length<2)return toast('Shkruaj emrin');const r=await api('/me','PATCH',{name:v('en'),cls:v('ec'),addr:v('ea')});if(!r.ok)return toast(r.error||'Gabim');U=r.user;editing=false;render();toast('Profili u ruajt ✓')}
async function boot(){const r=await api('/me');if(r.ok&&r.user)await finish(r.user,true);else{render();showAuth()}}
document.getElementById('auth').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth()});
function go(p){page=p;render();document.getElementById('view').scrollTop=0}
function render(){const v=document.getElementById('view'),y=v.scrollTop;v.innerHTML=`<div class="pg">${({home,notat,orari,njoftimet,profili})[page]()}</div>`;v.scrollTop=y;
 const ks=Object.keys(L);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===page));document.getElementById('ind').style.transform=`translateX(${ks.indexOf(page)*100}%)`;
 const ha=document.getElementById('ha');if(U){ha.src=IM[avk()];ha.style.display=''}else ha.style.display='none';const h=new Date().getHours();document.getElementById('greet').innerHTML=`${h<12?'Mirëmëngjes':h<18?'Mirëdita':'Mirëmbrëma'} 👋<b>${U?esc(U.name.split(' ')[0]):''}, gati për shkollë?</b><small style="opacity:.85;font-size:12px">${clk()}</small>`}
document.getElementById('nav').insertAdjacentHTML('beforeend',Object.keys(L).map(k=>`<button data-p="${k}" onclick="go('${k}')">${svg(k)}${L[k]}</button>`).join(''));
try{const t=ls.g('th',null);if(t)document.documentElement.dataset.theme=t}catch(e){}
document.getElementById('hl').src=IM.hat2;document.getElementById('sl').src=IM.education;boot();setTimeout(()=>document.getElementById('splash').classList.add('out'),300);setInterval(()=>{if(U&&(page==='home'||page==='orari')&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()},30000);
</script>
</body>
</html>
